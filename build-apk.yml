name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          mkdir app-src
          unzip -q paed-dose-app.zip -d app-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: app-src
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app-src/app/build/outputs/apk/release/app-release.apk PaedDose.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaedDose-apk
          path: PaedDose.apk

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PaedDose.apk \
            --title "Paed Dose (build ${{ github.run_number }})" \
            --notes "Download PaedDose.apk on your phone and install it. Build ${{ github.run_number }}."
